# docker-compose.yml
#
# Docker Compose lets us describe MULTIPLE containers that work together
# as one system, and start them all with a single command. Think of it
# as the instructions for setting up a whole restaurant (kitchen +
# dining room) at once, instead of building each room by hand.
#
# We define 4 services here:
#   - api:        the FastAPI "kitchen" (Phase 5)
#   - ui:         the Streamlit "dining room" (Phase 5), which talks to "api"
#   - prometheus: watches api's /metrics page and keeps a history of it
#   - grafana:    turns Prometheus's history into readable dashboards/graphs
#
# Both api and ui can reach Ollama running on YOUR Windows computer
# (outside Docker entirely) via the special address "host.docker.internal"
# - Docker's built-in way of saying "reach out of the box, to the host."

services:
  api:
    build: .
    container_name: smartroute-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Tells our code (see router/llm_clients.py) to reach Ollama on
      # the HOST computer instead of looking for it inside this container
      # (where it doesn't exist).
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      # Needed on Linux; harmless (and sometimes redundant, that's fine)
      # on Docker Desktop for Windows/Mac, which usually provides this
      # automatically.
      - "host.docker.internal:host-gateway"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

  ui:
    build: .
    container_name: smartroute-ui
    ports:
      - "8501:8501"
    environment:
      # Inside Docker's internal network, containers can reach each
      # other by SERVICE NAME - "api" here refers to the api service
      # above, not localhost.
      - API_URL=http://api:8000
    depends_on:
      - api
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0

  prometheus:
    image: prom/prometheus:latest
    container_name: smartroute-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    container_name: smartroute-grafana
    ports:
      - "3000:3000"
    environment:
      # Default login will be admin / admin - change this if you ever
      # expose this beyond your own machine.
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      # Named volume so your dashboards/settings survive a rebuild, even
      # though (as noted in DOCKER.md) the app's own db/chroma_data
      # currently don't - Grafana's own state isn't part of our app image
      # at all, so this one's free.
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  grafana-data: